<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOSCOW BUSINESS QUEST — Сравнение стилей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#05080f; --cyan:#3fd0ff; --cyan-soft:rgba(63,208,255,.45); --text:#dcebff; --dim:#8197b6;
         --title:'Orbitron',sans-serif; --ui:'Rajdhani',sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;font-family:var(--ui);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center}

  /* сцена 16:9 по центру окна (как в самих стилях) */
  .stage{position:relative;flex:0 0 auto;width:min(100vw,177.7778vh);height:min(56.25vw,100vh);
    overflow:hidden;background:var(--bg)}

  /* слайды деска: один виден за раз */
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease}
  .slide.active{opacity:1;visibility:visible}
  .slide iframe{width:100%;height:100%;border:0;display:block;background:#000}

  /* слайд-заглушка «в разработке» */
  .stub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 30%,rgba(63,208,255,.08),transparent 60%),linear-gradient(180deg,#0a1426,#05080f)}
  .stub .lock{width:84px;height:84px;border-radius:18px;border:1.5px dashed var(--cyan-soft);
    display:flex;align-items:center;justify-content:center;color:var(--cyan);opacity:.8}
  .stub .lock svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.6}
  .stub h2{font-family:var(--title);font-weight:900;font-size:26px;letter-spacing:2px;color:#fff;text-transform:uppercase}
  .stub p{color:var(--dim);font-size:17px;letter-spacing:.5px}

  /* счётчик стиля в нижнем доке (без оверлея на титуле) */
  .count{font-family:var(--title);font-size:13px;color:var(--dim);letter-spacing:1px}

  /* кнопки навигации */
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:50px;height:84px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;
    background:rgba(8,16,30,.55);color:var(--cyan);font-size:30px;font-family:var(--title);
    border:1px solid var(--cyan-soft);backdrop-filter:blur(4px);transition:background .2s}
  .nav:hover{background:rgba(63,208,255,.22);color:#fff}
  .nav.prev{left:14px;border-radius:0 10px 10px 0}
  .nav.next{right:14px;border-radius:10px 0 0 10px}

  /* нижняя панель: точки + действия */
  .dock{position:absolute;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:18px;
    padding:14px 22px;background:linear-gradient(0deg,rgba(3,6,12,.8),transparent)}
  .dots{display:flex;gap:9px}
  .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--cyan-soft);background:transparent;cursor:pointer;transition:.2s}
  .dot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan-soft)}
  .dock .sep{flex:1}
  .act{font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.5px;color:var(--text);
    background:rgba(8,16,30,.6);border:1px solid var(--cyan-soft);border-radius:6px;padding:7px 14px;cursor:pointer;text-decoration:none;transition:.2s}
  .act:hover{background:rgba(63,208,255,.18);color:#fff}
  .hint{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);z-index:30;
    font-size:12px;color:var(--dim);letter-spacing:.5px;white-space:nowrap;opacity:.8}
</style>
</head>
<body>
<div class="stage">
  <!-- слайды деска (заполняются скриптом) -->
  <div id="deck"></div>

  <!-- навигация -->
  <button class="nav prev" id="prev" aria-label="Назад">‹</button>
  <button class="nav next" id="next" aria-label="Вперёд">›</button>

  <span class="hint">← → стрелки · клик по точкам · R — заставка заново</span>

  <!-- нижний док -->
  <div class="dock">
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <span class="sep"></span>
    <button class="act" id="replay">↻ Заставка заново</button>
  </div>
</div>

<script>
// ===== список из 5 стилей: 3 готовых (iframe) + 2 заглушки =====
const STYLES = [
  {name:'Летняя Дневная Москва', tag:'Дневной свежий хайтек', src:'styles/Стиль - Летняя Дневная Москва/index.html'},
  {name:'Алиса · Сто лет вперёд', tag:'Кино-сайфай, светлое будущее', src:'styles/alisa-100/index.html'},
  {name:'Волшебный мир',          tag:'Тёплое фэнтези', src:'styles/garri-potter/index.html'},
  {name:'Мир тех-помощников',     tag:'Фиксики — добрый детский техно-мульт', src:'styles/fiksiki/index.html'},
  {name:'Остров сокровищ',        tag:'Сатирический рисованный 2D пиратский мультфильм', src:'styles/ostrov-sokrovish/index.html'}
];

const deck=document.getElementById('deck'), dotsEl=document.getElementById('dots');
const countEl=document.getElementById('count');
let cur=0;

// строим слайды и точки
STYLES.forEach((st,i)=>{
  const sl=document.createElement('div'); sl.className='slide';
  if(st.src){
    const f=document.createElement('iframe');
    f.title=st.name; f.loading='lazy'; f.dataset.src=st.src;  // src ставим только при показе (лениво)
    sl.appendChild(f);
  }else{
    sl.innerHTML='<div class="stub">'+
      '<div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>'+
      '<h2>'+st.name+'</h2><p>'+st.tag+' — скоро здесь</p></div>';
  }
  deck.appendChild(sl);

  const d=document.createElement('button'); d.className='dot'; d.title=st.name;
  d.onclick=()=>go(i); dotsEl.appendChild(d);
});
const slides=Array.from(deck.children);

// показать слайд i: активный iframe (пере)грузим, чтобы заиграла его заставка; остальные выгружаем
function go(i){
  cur=(i+STYLES.length)%STYLES.length;
  slides.forEach((s,idx)=>{
    s.classList.toggle('active',idx===cur);
    const f=s.querySelector('iframe');
    if(!f) return;
    if(idx===cur){ loadFrame(f); }
    else if(f.src){ f.removeAttribute('src'); }   // выгружаем тяжёлый фон у неактивных
  });
  const st=STYLES[cur];
  countEl.textContent='Стиль '+(cur+1)+' / '+STYLES.length+' · '+st.name;
  dotsEl.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));
}
// грузим iframe заново (cache-buster ⇒ заставка проигрывается каждый раз)
function loadFrame(f){
  const base=f.dataset.src;
  // titul=1 — режим «только титул» (прячет внутреннюю навигацию стиля); _t — чтобы заставка играла заново
  f.src=base+(base.indexOf('?')<0?'?':'&')+'titul=1&_t='+Date.now();
}
function replay(){ const f=slides[cur].querySelector('iframe'); if(f) loadFrame(f); }

document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('replay').onclick=replay;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ go(cur+1); }
  else if(e.key==='ArrowLeft'){ go(cur-1); }
  else if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'){ replay(); }
});

go(0);
</script>
</body>
</html>
