<!DOCTYPE html>

<meta charset="UTF-8">

<title>Слайд 1 — карта маршрутов</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1410}

/* сцена = картинка слайда (2172×724, ровно 3:1); SVG ложится 1:1 поверх */
.stage{
  position:relative;
  width:100vw; height:calc(100vw*724/2172);
  max-height:100vh; max-width:calc(100vh*2172/724);
  margin:auto; top:50%; transform:translateY(-50%);
  background:#cfe6dd url("Слайд 1 изображение.png") center/cover no-repeat;
}
.overlay{position:absolute;inset:0;width:100%;height:100%}

/* ── контуры объектов: постоянное мягкое свечение ── */
.objline{
  fill:none; stroke:#27e3ff; stroke-width:4;
  stroke-linejoin:round; stroke-linecap:round;
  filter:drop-shadow(0 0 6px #27e3ff);
  animation:objpulse 2.4s ease-in-out infinite;
}
@keyframes objpulse{
  0%,100%{opacity:.5;  filter:drop-shadow(0 0 4px rgba(39,227,255,.7))}
  50%    {opacity:1;   filter:drop-shadow(0 0 14px rgba(39,227,255,1))}
}

/* ── маршруты: видны ВСЕГДА (полупрозрачные), активный — ярче ── */
.route{
  fill:none; stroke:#ff2bd6; stroke-width:6;
  stroke-linecap:round; stroke-linejoin:round;
  opacity:.28;
}
.route.active{ opacity:.95; filter:drop-shadow(0 0 8px #ff2bd6); }

/* ── узлы старт/финиш ── */
.node{ fill:#ff00e6; stroke:#fff; stroke-width:2; opacity:.45; transition:.25s; }
.node.start{ opacity:.9; filter:drop-shadow(0 0 6px #ff00e6); }
.node.active{ opacity:1; filter:drop-shadow(0 0 12px #ff00e6); }

/* ── шагающие стопы ── */
.foot{ fill:#ffffff; stroke:#ff2bd6; stroke-width:1.2;
  filter:drop-shadow(0 0 5px #ff2bd6); opacity:0; }
.walker.go .foot{ opacity:1; }
</style>

<script>
/* ── Последовательная «прогулка» по маршрутам ──
   По активному маршруту идут две стопы (как человек): к финишу → обратно к старту.
   Затем следующий маршрут. По кругу. Контуры объектов и все пути видны всегда. */
const routes  = [...document.querySelectorAll('.route')];
const ends    = [...document.querySelectorAll('#ends .node')];
const walker  = document.getElementById('walker');
const footL   = document.getElementById('footL');
const footR   = document.getElementById('footR');

const SPEED   = 520;   // ед./сек — скорость ходьбы (постоянная)
const HOLD    = 350;   // пауза на финише
const GAP     = 250;   // пауза между маршрутами
const GAPW    = 5.5;   // полу-расстояние между стопами (поперёк пути)
const STRIDE  = 9;     // смещение стоп вдоль пути (шаг)
const STEPLEN = 22;    // через сколько единиц пути переставляется ведущая нога

const wait = ms => new Promise(r => setTimeout(r, ms));

// поставить стопы по точке пути t (с направлением движения)
function placeFeet(path, t, dir){
  const L = +path.dataset.len;
  const a = path.getPointAtLength(Math.max(0, Math.min(t, L)));
  const b = path.getPointAtLength(Math.max(0, Math.min(t + dir*2, L)));
  const ang = Math.atan2(b.y - a.y, b.x - a.x);       // направление движения
  const ux = Math.cos(ang), uy = Math.sin(ang);        // вдоль пути
  const nx = -uy, ny = ux;                             // поперёк пути
  const lead = Math.floor(t / STEPLEN) % 2;            // какая нога впереди (имитация шага)
  const sL = lead ? STRIDE/2 : -STRIDE/2;
  const sR = lead ? -STRIDE/2 : STRIDE/2;
  const deg = ang * 180 / Math.PI + 90;                // стопа вытянута по ходу
  footL.setAttribute('transform',
    `translate(${a.x + nx*GAPW + ux*sL}, ${a.y + ny*GAPW + uy*sL}) rotate(${deg})`);
  footR.setAttribute('transform',
    `translate(${a.x - nx*GAPW + ux*sR}, ${a.y - ny*GAPW + uy*sR}) rotate(${deg})`);
}

// пройти путь в одну сторону (dir=+1 вперёд, -1 назад)
function walkOnce(path, dir){
  return new Promise(res=>{
    const L = +path.dataset.len;
    const dur = Math.max(700, (L / SPEED) * 1000);
    let t0 = null;
    function frame(ts){
      if(t0===null) t0 = ts;
      let p = (ts - t0) / dur;              // 0..1
      if(p > 1) p = 1;
      const t = dir > 0 ? p*L : (1-p)*L;    // позиция вдоль пути
      placeFeet(path, t, dir);
      if(p < 1) requestAnimationFrame(frame); else res();
    }
    requestAnimationFrame(frame);
  });
}

routes.forEach(r => r.dataset.len = r.getTotalLength());

async function walkAll(){
  while(true){
    for(let i=0;i<routes.length;i++){
      const r = routes[i], node = ends[i];
      r.classList.add('active'); if(node) node.classList.add('active');
      walker.classList.add('go');
      await walkOnce(r, +1);    // к финишу
      await wait(HOLD);
      await walkOnce(r, -1);    // обратно к старту
      walker.classList.remove('go');
      r.classList.remove('active'); if(node) node.classList.remove('active');
      await wait(GAP);
    }
  }
}
walkAll();
</script>
