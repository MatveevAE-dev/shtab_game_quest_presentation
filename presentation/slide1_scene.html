<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Слайд 1 — сцена (3 фазы)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1410}

.stage{
  position:relative;
  width:100vw; height:calc(100vw*724/2172);
  max-height:100vh; max-width:calc(100vh*2172/724);
  margin:auto; top:50%; transform:translateY(-50%);
  background:#cfe6dd url("Слайд 1 изображение.png") center/cover no-repeat;
}
.overlay{position:absolute;inset:0;width:100%;height:100%}

/* ── контуры объектов ── */
.objline{fill:none;stroke:#27e3ff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
  filter:drop-shadow(0 0 3px #27e3ff);animation:objpulse 2.4s ease-in-out infinite;transition:opacity .5s}
@keyframes objpulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── маршруты: прозрачность задаём ГРУППЕ #routes, а не каждой линии,
      иначе общие участки складываются и горят ярче ── */
.route{fill:none;stroke:#27e3ff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
#routes{opacity:.3;transition:opacity .5s}

/* ── узлы (в цвет контуров) ── */
.node{fill:#27e3ff;stroke:#fff;stroke-width:2;opacity:.45;transition:.25s}
.node.start{opacity:.9;filter:drop-shadow(0 0 6px #27e3ff)}
.node.active{opacity:1;filter:drop-shadow(0 0 12px #27e3ff)}

/* ── всплывающее название объекта над финишем ── */
.objlabel{fill:#fff;font-family:"Dela Gothic One",system-ui,sans-serif;font-size:26px;
  paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:6px;stroke-linejoin:round;
  opacity:0;transition:opacity .25s ease}
.objlabel.show{opacity:1}

/* ── комета по активному маршруту ── */
.comet{opacity:0;transition:opacity .2s ease}
.comet.on{opacity:1}
#cometTrail{fill:none;stroke:#aef4ff;stroke-width:6;stroke-linecap:round;
  filter:drop-shadow(0 0 6px #27e3ff)}
#cometHead{fill:#fff;filter:drop-shadow(0 0 8px #27e3ff) drop-shadow(0 0 14px #27e3ff)}

/* ── эскаватор + эффекты (только фаза 3) ── */
#exc{opacity:0;
  filter:drop-shadow(0 0 3px #ff7a00) drop-shadow(0 0 8px #ff7a00) drop-shadow(0 0 16px rgba(255,122,0,.6))}
.puff{fill:#d2c5ac}
/* объект под снос — красный контур, по умолчанию скрыт */
.demolish{fill:none;stroke:#ff2a2a;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;
  opacity:0}
.demolish.show{filter:drop-shadow(0 0 8px #ff2a2a);animation:redpulse 2.4s ease-in-out infinite}
@keyframes redpulse{0%,100%{opacity:.5}50%{opacity:1}}
.spark2{fill:#ffd24a;filter:drop-shadow(0 0 4px #ff8a00)}
/* тройка-защитники — скрыта, появляется через JS */
#troika{opacity:0;filter:drop-shadow(0 .4vw .8vw rgba(0,0,0,.45))}
.star{fill:#fff3b0;filter:drop-shadow(0 0 5px #ffd24a)}
.burst{fill:#ffffff;filter:drop-shadow(0 0 6px #ffe08a)}

/* ── затемнение + текст: ЕДИНАЯ логика для фаз 2 и 4 ── */
/* тёмная заливка въезжает ВОЛНОЙ слева→направо (явный wipe) */
.dim,.veil{position:absolute;inset:0;pointer-events:none;
  /* как в референсе: градиент чёрного слева .03 → справа .7 (ровный тёмный правый край) */
  background:linear-gradient(90deg, rgba(0,0,0,.03) 0%, rgba(0,0,0,.7) 100%);
  clip-path:inset(0 100% 0 0);                  /* скрыто: волна у левого края */
  transition:clip-path .85s cubic-bezier(.22,.61,.36,1)}
.dim{z-index:3}
.veil{z-index:5}
.stage.p2 .dim{clip-path:inset(0 0 0 0)}         /* волна доходит до правого края */
.stage.p4 .veil{clip-path:inset(0 0 0 0)}

/* блок текста (одинаково для обеих фаз): строки выходят снизу по очереди */
.stext{position:absolute;z-index:6;left:5%;top:9%;
  width:55%;color:#fff;font-family:"Dela Gothic One",system-ui,sans-serif;
  text-shadow:0 .2vw 1vw rgba(0,0,0,.55);pointer-events:none}
.stext .ln{display:block;opacity:0;transform:translateY(30px);
  transition:opacity .6s ease, transform .6s cubic-bezier(.22,.61,.36,1)}
.stext .h{font-size:4.2vw;line-height:1.08;margin-bottom:1.2vw}
.stext .s{font-size:1.9vw;line-height:1.25;font-family:system-ui,sans-serif;font-weight:600}
/* строки появляются ПОСЛЕ того как волна заливки прошла */
.stext .ln:nth-child(1){transition-delay:.5s}
.stext .ln:nth-child(2){transition-delay:.68s}
.stext .ln:nth-child(3){transition-delay:.86s}
.stage.p2 #slideText .ln, .stage.p4 #slide4Text .ln{opacity:1;transform:none}
.stage.p2 #slideText .s, .stage.p4 #slide4Text .s{opacity:.92}

.stage.p3 #exc{opacity:1}
.stage.p3 .fx{opacity:1}

/* в фазах 2 и 4 приглушаем контуры/маршруты/узлы под заливкой */
.stage.p2 .objline,.stage.p4 .objline{opacity:.1 !important;animation:none}
.stage.p2 #routes,.stage.p4 #routes{opacity:.06}
.stage.p2 .node,.stage.p4 .node{opacity:.08}

/* подсказка по навигации */
.hint{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);z-index:6;
  font-family:system-ui,sans-serif;font-size:.9vw;color:#fff;background:rgba(0,0,0,.4);
  padding:.4vw .9vw;border-radius:.6vw;opacity:.65}
</style>
</head>
<body>
<div class="stage p1">
  <svg class="overlay" viewBox="0 0 2172 724" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

<script>
/* ===== фазы ===== */
const stage = document.querySelector('.stage');
const hint  = document.getElementById('hint');
let phase = 1;
function setPhase(p){
  phase = (p+4-1)%4+1;            // 1..4 циклично
  stage.classList.remove('p1','p2','p3','p4');
  stage.classList.add('p'+phase);
  hint.textContent = 'Фаза '+phase+' / 4 · → или пробел — далее, ← — назад';
  if(phase===3){ runDemolition(); }
  else { resetDemolition(); }
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); setPhase(phase+1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); setPhase(phase===1?4:phase-1); }
});

/* ===== шагающие стопы по маршрутам (фаза 1) ===== */
const routes=[...document.querySelectorAll('.route')];
const ends  =[...document.querySelectorAll('#ends .node')];
const comet=document.getElementById('comet');
const cometTrail=document.getElementById('cometTrail');
const cometHead=document.getElementById('cometHead');
const objLabel=document.getElementById('objLabel');
/* НАЗВАНИЯ ОБЪЕКТОВ — порядок = порядок финишей (#ends). Заменишь на реальные. */
const NAMES=['ДПиИР','МБМ','Кафе','Шаурмечная','ФСК',
             'Кластер Ломоносов','Сеть кафе','Торговый центр','Штаб','ФПСП'];
function showLabel(node,name){
  if(!node||!name)return;
  objLabel.textContent=name;
  objLabel.setAttribute('x', node.getAttribute('cx'));
  objLabel.setAttribute('y', (+node.getAttribute('cy'))-20);  // над узлом
  objLabel.classList.add('show');
}
function hideLabel(){ objLabel.classList.remove('show'); }
const SPEED=400,GAP=250,TAIL=75;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
routes.forEach(r=>r.dataset.len=r.getTotalLength());
/* комета летит вдоль маршрута: хвост = бегущий штрих, голова = яркая точка */
function cometRun(path){return new Promise(res=>{
  const L=+path.dataset.len, dur=Math.max(700,(L/SPEED)*1000);
  cometTrail.setAttribute('d', path.getAttribute('d'));
  cometTrail.style.strokeDasharray=TAIL+' '+(L+TAIL);
  let t0=null;
  function frame(ts){ if(t0===null)t0=ts; let p=(ts-t0)/dur; if(p>1)p=1;
    const d=p*L;
    cometTrail.style.strokeDashoffset=(TAIL-d);              // хвост тянется за головой
    const pt=path.getPointAtLength(d);
    cometHead.setAttribute('cx',pt.x); cometHead.setAttribute('cy',pt.y);
    if(p<1) requestAnimationFrame(frame); else res();
  }
  requestAnimationFrame(frame);
});}
async function walkAll(){
  while(true){
    for(let i=0;i<routes.length;i++){
      if(phase!==1){ comet.classList.remove('on'); hideLabel(); await wait(300); continue; }
      const r=routes[i],node=ends[i];
      if(node)node.classList.add('active'); comet.classList.add('on');    // маршрут НЕ подсвечиваем
      await cometRun(r);                                                  // комета: старт→финиш
      comet.classList.remove('on');
      showLabel(node, NAMES[i]);                                          // название над объектом
      await wait(1100);
      hideLabel(); if(node)node.classList.remove('active');
      await wait(GAP);
    }
  }
}
walkAll();

/* ===================== ФАЗА 3: СНОС (последовательность) =====================
   1) эскаватор въезжает справа, из-под гусениц тянется пыль (тает следом);
   2) под ковшом — мультяшный удар: вспышки-«бам», звёзды, искры (повторяются);
   3) пыль вырастает и накрывает ВСЁ здание.                                     */
const SVGNS='http://www.w3.org/2000/svg';
const excEl=document.getElementById('exc');
const dustTrailG=document.getElementById('dustTrail');
const buildingDustG=document.getElementById('buildingDust');
const impactG=document.getElementById('impact');
const demolishEl=document.getElementById('obj-demolish');
const troikaEl=document.getElementById('troika');
const TROIKA={x:1038, y:686};                    // центр/низ тройки (для пыли из-под ног)

const EXC_X=1132, EXC_IN=620, EXC_DUR=1400;      // финальный x, смещение въезда, длительность
const IMPACT={x:1150, y:520};                    // точка под ковшом (на здании)
const BLD={x:1039, y:578};                       // центр здания (для облака пыли)
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   // плавный старт И финиш

let excRAF=null, trailInt=null, excBackRAF=null;
let impactTimer=null, dustBreath=null, troikaWiggle=null, troikaEnter=null;
const seqTimers=[];

function mk(tag,attrs,cls){const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(cls)e.setAttribute('class',cls);
  e.style.transformBox='fill-box'; e.style.transformOrigin='center'; return e;}
function starPts(cx,cy,spikes,outer,inner){let p=[],step=Math.PI/spikes,a=-Math.PI/2;
  for(let i=0;i<spikes*2;i++){const r=i%2?inner:outer;
    p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));a+=step;}
  return p.join(' ');}

/* — пыль из-под гусениц (тянется и тает) — */
function trailPuff(x,y){
  for(let k=0;k<3;k++){
    const c=mk('circle',{cx:x+(Math.random()*44-22), cy:y+(Math.random()*14-7),
      r:(18+Math.random()*16).toFixed(1)},'puff');
    c.style.fill='#efe6d2';                 // ярче (светлая пыль)
    dustTrailG.appendChild(c);
    c.animate([{opacity:1,transform:'scale(.5)'},{opacity:0,transform:'scale(2.1)'}],
      {duration:1100+Math.random()*500,easing:'ease-out',fill:'forwards'}).onfinish=()=>c.remove();
  }
}

/* — мультяшный удар под ковшом — */
function impactPop(){
  // центральная вспышка-«бам»
  const burst=mk('polygon',{points:starPts(IMPACT.x,IMPACT.y,12,28,11)},'burst');
  impactG.appendChild(burst);
  burst.animate([{opacity:1,transform:'scale(.3) rotate(0deg)'},
                 {opacity:0,transform:'scale(1.5) rotate(25deg)'}],
    {duration:360,easing:'ease-out',fill:'forwards'}).onfinish=()=>burst.remove();
  // звёздочки вокруг
  for(let i=0;i<3;i++){
    const ox=Math.random()*70-35, oy=Math.random()*40-28;
    const st=mk('polygon',{points:starPts(IMPACT.x+ox,IMPACT.y+oy,5,9,3.6)},'star');
    impactG.appendChild(st);
    st.animate([{opacity:1,transform:'scale(.2) rotate(0deg)'},
                {opacity:0,transform:'scale(1.2) rotate(40deg)'}],
      {duration:520,easing:'ease-out',fill:'forwards'}).onfinish=()=>st.remove();
  }
  // искры — летят вниз/в стороны
  for(let i=0;i<5;i++){
    const sp=mk('circle',{cx:IMPACT.x,cy:IMPACT.y,r:(Math.random()*2+1).toFixed(1)},'spark2');
    impactG.appendChild(sp);
    const dx=Math.random()*70-35, dy=Math.random()*30+10;
    sp.animate([{opacity:1,transform:'translate(0,0)'},
                {opacity:0,transform:`translate(${dx}px,${dy}px)`}],
      {duration:420+Math.random()*260,easing:'ease-out',fill:'forwards'}).onfinish=()=>sp.remove();
  }
}
function startImpact(){ if(impactTimer)return; impactTimer=setInterval(impactPop,260); }
function stopImpact(){ clearInterval(impactTimer); impactTimer=null; impactG.innerHTML=''; }

/* — облако пыли, накрывающее всё здание — */
function growBuildingDust(){
  buildingDustG.innerHTML='';
  const spots=[[0,0,300,150],[-180,-15,180,120],[170,10,200,130],
               [-60,45,210,120],[80,-55,180,110],[-250,30,150,90],[260,35,160,95]];
  spots.forEach((s,i)=>{
    const e=mk('ellipse',{cx:BLD.x+s[0],cy:BLD.y+s[1],rx:s[2],ry:s[3]},'puff');
    buildingDustG.appendChild(e);
    e.animate([{opacity:0,transform:'scale(.3)'},{opacity:.32,transform:'scale(1)'}],
      {duration:1000,delay:i*70,easing:'ease-out',fill:'forwards'});
  });
  // лёгкое «дыхание» после того как накрыло (полупрозрачно — здание просвечивает)
  seqTimers.push(setTimeout(()=>{ if(phase===3)
    dustBreath=buildingDustG.animate([{opacity:.85},{opacity:.6},{opacity:.85}],
      {duration:3500,iterations:Infinity,easing:'ease-in-out'}); }, 1200));
}

/* — пыль тает (тройка отстояла здание) — */
function hideBuildingDust(){
  if(dustBreath){dustBreath.cancel();dustBreath=null;}
  const a=buildingDustG.animate([{opacity:1},{opacity:0}],{duration:800,easing:'ease-out',fill:'forwards'});
  a.onfinish=()=>{ buildingDustG.innerHTML=''; };
}

/* — пыль из-под ног тройки при приземлении — */
function troikaPoof(){
  for(let k=0;k<6;k++){
    const c=mk('circle',{cx:TROIKA.x+(Math.random()*300-150), cy:TROIKA.y+(Math.random()*12-6),
      r:(14+Math.random()*16).toFixed(1)},'puff');
    c.style.fill='#efe6d2';
    dustTrailG.appendChild(c);
    c.animate([{opacity:.9,transform:'scale(.4)'},{opacity:0,transform:'scale(2)'}],
      {duration:900+Math.random()*300,easing:'ease-out',fill:'forwards'}).onfinish=()=>c.remove();
  }
}

/* — тройка плавно поднимается и заслоняет здание — */
function showTroika(){
  troikaEl.style.transformBox='fill-box';
  troikaEl.style.transformOrigin='bottom center';
  troikaPoof();
  // мягкий подъём+проявление, без резкого отскока (fill:forwards держит видимость)
  troikaEnter=troikaEl.animate([
    {opacity:0, transform:'translateY(54px) scale(.9)'},
    {opacity:1, transform:'translateY(0) scale(1)'}
  ],{duration:900,easing:'cubic-bezier(.22,.61,.36,1)',fill:'forwards'});
  troikaEnter.onfinish=()=>{
    if(phase!==3)return;
    // едва заметное «дыхание»-покачивание — стоят, не дают снести
    troikaWiggle=troikaEl.animate(
      [{transform:'rotate(-.8deg)'},{transform:'rotate(.8deg)'}],
      {duration:900,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
  };
}

/* — эскаватор плавно сдаёт назад (вправо, откуда приехал) — */
function excBackup(){
  const x0=+excEl.getAttribute('x'), x1=x0+175, dur=1500; let t0=null;
  function fr(ts){ if(t0===null)t0=ts; let p=(ts-t0)/dur; if(p>1)p=1;
    excEl.setAttribute('x', x0+(x1-x0)*easeInOut(p));   // плавный старт и финиш
    if(p<1) excBackRAF=requestAnimationFrame(fr); else excBackRAF=null; }
  excBackRAF=requestAnimationFrame(fr);
}

/* — запуск всей сцены сноса — */
function runDemolition(){
  resetDemolition();
  // 1) въезд справа + пыль из-под гусениц (спавн по таймеру — виден при любом FPS)
  let t0=null;
  function frame(ts){
    if(t0===null)t0=ts;
    let p=(ts-t0)/EXC_DUR; if(p>1)p=1;
    const e=easeOut(p), x=EXC_X+EXC_IN*(1-e);
    excEl.setAttribute('x', x);
    excEl.style.opacity=e;
    if(p<1) excRAF=requestAnimationFrame(frame);
    else { excRAF=null; if(trailInt){clearInterval(trailInt);trailInt=null;} }
  }
  excRAF=requestAnimationFrame(frame);
  trailInt=setInterval(()=>{ const x=+excEl.getAttribute('x'); trailPuff(x+150,655); }, 70);
  seqTimers.push(setTimeout(()=>{ if(trailInt){clearInterval(trailInt);trailInt=null;} }, EXC_DUR+200));
  // 2) после приезда — подсветить объект под снос красным + удар под ковшом
  seqTimers.push(setTimeout(()=>{ if(phase===3) demolishEl.classList.add('show'); }, EXC_DUR+200));
  seqTimers.push(setTimeout(()=>{ if(phase===3) startImpact(); }, EXC_DUR+450));
  // 3) пыль накрывает здание; удар стихает, когда накрыло
  seqTimers.push(setTimeout(()=>{ if(phase===3) growBuildingDust(); }, EXC_DUR+1600));
  // 4) тройка врывается и заслоняет здание; красная метка сноса гаснет
  seqTimers.push(setTimeout(()=>{ if(phase===3){ stopImpact(); showTroika(); demolishEl.classList.remove('show'); } }, EXC_DUR+2700));
  // 5) эскаватор сдаёт назад, пыль тает
  seqTimers.push(setTimeout(()=>{ if(phase===3) excBackup(); }, EXC_DUR+2950));
  seqTimers.push(setTimeout(()=>{ if(phase===3) hideBuildingDust(); }, EXC_DUR+3100));
}
function resetDemolition(){
  if(excRAF){cancelAnimationFrame(excRAF);excRAF=null;}
  if(excBackRAF){cancelAnimationFrame(excBackRAF);excBackRAF=null;}
  if(trailInt){clearInterval(trailInt);trailInt=null;}
  if(dustBreath){dustBreath.cancel();dustBreath=null;}
  seqTimers.splice(0).forEach(clearTimeout);
  stopImpact();
  demolishEl.classList.remove('show');
  dustTrailG.innerHTML=''; buildingDustG.innerHTML='';
  // сброс тройки — отменяем анимации, возвращается CSS opacity:0 (скрыта)
  if(troikaEnter){troikaEnter.cancel();troikaEnter=null;}
  if(troikaWiggle){troikaWiggle.cancel();troikaWiggle=null;}
  troikaEl.style.transform='';
  excEl.setAttribute('x',EXC_X); excEl.style.opacity='';   // CSS вернёт 0 вне фазы 3
}

setPhase(1);
</script>
