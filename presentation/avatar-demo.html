<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аватары · демо (4 на экране)</title>
<style>
:root{
  --neon:#27e3ff; --cyan:#3fd0ff; --cyan-soft:rgba(63,208,255,.55);
  --gold:#ffd24a;
  --title-font:'Orbitron','Segoe UI',sans-serif; --hauss:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03080e;font-family:var(--hauss);color:#eaf6ff}

/* СЦЕНА — как в показе: сверхширокая 2172×724 (~2.96:1), центрирована, поля по краям */
.stage{position:absolute;inset:0;margin:auto;
  width:100vw;height:calc(100vw*724/2172);max-height:100vh;max-width:calc(100vh*2172/724);
  /* карта Москвы + затемнение как на слайде 3 (тут ровное, т.к. 4 аватара по центру) */
  background:linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.6)),
             url("assets/img/bg/Карта Москвы без героя.png") center/cover;
  container-type:size;container-name:stage}

/* РЯД из 4 ячеек */
.row{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4cqw;padding:0 3cqw}
.cell{display:flex;flex-direction:column;align-items:center;gap:1.6cqh;width:15.4cqw}   /* октаэдр меньше в 1.3 раза */

/* ── АВАТАР: октаэдр (гекс) + картинка внутри (90%) + контур для скана ── */
.avatar{position:relative;width:100%;aspect-ratio:.92;
  --hex:polygon(50% 1%, 99% 26%, 99% 74%, 50% 99%, 1% 74%, 1% 26%)}
.ava-bg{position:absolute;inset:0;clip-path:var(--hex);
  background:radial-gradient(120% 120% at 50% 25%, rgba(20,50,70,.55), rgba(6,16,26,.92));opacity:0}
.ava-frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ava-frame polygon{fill:none;stroke:var(--neon);stroke-width:2.2;
  filter:drop-shadow(0 0 4px var(--neon)) drop-shadow(0 0 9px var(--neon));stroke-linejoin:round;opacity:0}
.ava-fig{position:absolute;inset:0;z-index:2}
.ava-img,.ava-outline{position:absolute;inset:5%;width:90%;height:90%;
  object-fit:contain;object-position:50% 50%;pointer-events:none;clip-path:var(--hex)}
.ava-img{opacity:0;filter:blur(16px) saturate(.8);transform:scale(1.04);z-index:2}
.ava-outline{opacity:0;z-index:3}
.ava-spark{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan),0 0 14px var(--neon);opacity:0;pointer-events:none}

/* ── ФАЗЫ появления ── */
.avatar.play .ava-spark{animation:sparkIn .7s ease-out forwards}
@keyframes sparkIn{0%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.3)}
  30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(1)}}
.avatar.play .ava-bg{animation:fadeIn .5s ease .5s forwards}
.avatar.play .ava-frame polygon{animation:fadeIn .5s ease .5s forwards}
@keyframes fadeIn{to{opacity:1}}
.avatar.play .ava-img{animation:faceIn 2.2s ease .6s forwards}
@keyframes faceIn{0%{opacity:0;filter:blur(16px) saturate(.8);transform:scale(1.04)}
  100%{opacity:1;filter:blur(0) saturate(1);transform:scale(1)}}
.avatar.play .ava-outline{animation:avaDraw 2.95s ease 2.9s forwards}
@keyframes avaDraw{0%{opacity:1;clip-path:inset(0 0 100% 0)}
  76%,82%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.avatar.live .ava-fig{animation:boomer 2.13s ease-in-out infinite alternate}
@keyframes boomer{from{transform:scale(1) translateY(0)}to{transform:scale(1.03) translateY(-4px)}}
.avatar.live .ava-frame polygon{animation:frameGlow 2.4s ease-in-out infinite}
@keyframes frameGlow{0%,100%{opacity:.7}50%{opacity:1}}

/* ── ПОДПИСЬ: канонический размер названий объектов (Orbitron 14px, циан-короб) ── */
.ava-card{display:flex;flex-direction:column;align-items:center;gap:.6cqh;text-align:center;width:100%}
.ava-top{margin-bottom:1cqh}                                /* НАД октаэдром */
.ava-bottom{margin-top:1cqh}                                /* ПОД октаэдром */
/* блоки скрыты, показываются ПОШТУЧНО при печати (JS) */
.ava-org,.ava-name,.ava-desc{opacity:0}
/* подразделение — крупнее */
.ava-org{font-family:var(--title-font);font-weight:700;color:var(--cyan);
  font-size:15px;letter-spacing:.05em;text-transform:uppercase}
/* имя — как название объекта: тёмный фон + циан-рамка + белый Orbitron uppercase */
.ava-name{font-family:var(--title-font);font-weight:700;color:#fff;font-size:15px;
  text-transform:uppercase;letter-spacing:.04em;
  padding:6px 12px;border:1px solid var(--cyan-soft);border-radius:4px;
  background:rgba(8,16,30,.95);box-shadow:0 0 18px rgba(63,208,255,.25)}
/* описание — крупнее */
.ava-desc{font-family:var(--hauss);font-weight:600;color:#cfe6f5;font-size:15px;line-height:1.35;max-width:100%}
/* каретка печати — мигает, исчезает по завершении блока */
.tw-caret{color:var(--cyan);margin-left:1px;animation:twBlink .7s step-end infinite}
@keyframes twBlink{50%{opacity:0}}

.hint{position:fixed;left:16px;bottom:12px;font-size:12px;color:#5f7a8c;z-index:5}
.replay{position:fixed;right:16px;bottom:12px;font-family:var(--title-font);font-size:12px;
  letter-spacing:.1em;color:#03080e;background:var(--cyan);border:none;border-radius:6px;
  padding:8px 14px;cursor:pointer;box-shadow:0 0 16px var(--cyan-soft);z-index:5}
.replay:hover{filter:brightness(1.1)}
</style>
</head>
<body>

<div class="stage"><div class="row" id="row"></div></div>

<div class="hint">клик / → — показать следующий аватар (по одному) · стиль «На одной волне»</div>
<button class="replay" id="replay">⟲ СБРОС</button>

<script>
/* 4 помощника (изображение Дерюгина — плейсхолдер для всех, пока нет остальных) */
const AVA=[
  {org:'МБМ · Малый бизнес Москвы', name:'Дерюгин А. В.', desc:'Нефинансовые услуги: план, консультации, обучение.'},
  {org:'ФСК · Гарантийный фонд',     name:'Фамилия И. О.', desc:'Финансирование: поручительство, льготный кредит.'},
  {org:'ФПСП · Соц. проекты',        name:'Фамилия И. О.', desc:'Социальное предпринимательство, инклюзия, акселерация.'},
  {org:'ШТАБ · Защита бизнеса',      name:'Фамилия И. О.', desc:'Обязательные требования, обращения, защита.'},
];
const IMG='assets/img/objects/avatar-deryugin.png';
const OUT='assets/img/objects/avatar-deryugin-outline.png';

const row=document.getElementById('row');
AVA.forEach(a=>{
  const cell=document.createElement('div'); cell.className='cell';
  cell.innerHTML=
    '<div class="ava-card ava-top">'+                       // НАД октаэдром: только ФИО
      '<div class="ava-name">'+a.name+'</div>'+
    '</div>'+
    '<div class="avatar">'+
      '<div class="ava-bg"></div>'+
      '<div class="ava-fig">'+
        '<img class="ava-img" src="'+IMG+'" alt="'+a.name+'">'+
        '<img class="ava-outline" src="'+OUT+'" alt="">'+
      '</div>'+
      '<svg class="ava-frame" viewBox="0 0 100 100" preserveAspectRatio="none">'+
        '<polygon points="50,1 99,26 99,74 50,99 1,74 1,26"/></svg>'+
    '</div>'+
    '<div class="ava-card ava-bottom">'+                    // ПОД октаэдром: подразделение + описание
      '<div class="ava-org">'+a.org+'</div>'+
      '<div class="ava-desc">'+a.desc+'</div>'+
    '</div>';
  row.appendChild(cell);
});

const cells=[...document.querySelectorAll('.cell')];
/* сохранить полные тексты подписи и зарезервировать высоту (октаэдр не прыгает при печати) */
cells.forEach(cell=>{
  cell.__els=[...cell.querySelectorAll('.ava-org,.ava-name,.ava-desc')];
  cell.__els.forEach(el=>el.dataset.full=el.textContent);
});
window.addEventListener('load',()=>cells.forEach(c=>{
  c.querySelectorAll('.ava-card').forEach(card=>card.style.minHeight=card.offsetHeight+'px');
}));

function makeSparks(av,n){
  av.querySelectorAll('.ava-spark').forEach(s=>s.remove());
  for(let i=0;i<n;i++){
    const s=document.createElement('div'); s.className='ava-spark';
    const ang=(i/n)*Math.PI*2, r=90+((i*37)%50);
    s.style.setProperty('--dx',(Math.cos(ang)*r).toFixed(0)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*r).toFixed(0)+'px');
    s.style.animationDelay=(i%6)*30+'ms';
    av.appendChild(s);
  }
}
let timers=[];
/* печать одного блока с кареткой ▌ → done по завершении */
function typeBlock(el, speed, done){
  el.style.opacity='1';
  el.innerHTML='<span class="tw-txt"></span><span class="tw-caret">▌</span>';
  const t=el.querySelector('.tw-txt'), caret=el.querySelector('.tw-caret');
  const full=el.dataset.full; let i=0;
  (function ch(){
    t.textContent=full.slice(0,i++);
    if(i<=full.length) timers.push(setTimeout(ch, speed));
    else { caret.remove(); done&&done(); }
  })();
}
const CARD_PAUSE=600;
/* подпись печатается ПОЭТАПНО: организация → ФИО → описание */
function typeCard(cell){
  const e=cell.__els;
  typeBlock(e[0], 42, ()=>
    timers.push(setTimeout(()=> typeBlock(e[1], 52, ()=>
      timers.push(setTimeout(()=> typeBlock(e[2], 24), CARD_PAUSE))
    ), CARD_PAUSE)));
}
/* показать ОДИН аватар: искры → рамка → картинка → скан контура → (контур исчез) → печать подписи */
function revealAvatar(cell){
  const av=cell.querySelector('.avatar');
  av.classList.remove('play','live');
  cell.__els.forEach(el=>{ el.style.opacity='0'; el.textContent=el.dataset.full; });
  makeSparks(av,16); void av.offsetWidth;
  av.classList.add('play');
  timers.push(setTimeout(()=>av.classList.add('live'), 2900));   // бумеранг-idle
  timers.push(setTimeout(()=>typeCard(cell), 5900));             // подпись ПОСЛЕ исчезновения контура аватара
}

let shown=0;
function nextAvatar(){ if(shown<cells.length) revealAvatar(cells[shown++]); }
function resetAll(){
  timers.splice(0).forEach(clearTimeout); shown=0;
  cells.forEach(cell=>{
    cell.querySelector('.avatar').classList.remove('play','live');
    cell.__els.forEach(el=>{ el.style.opacity='0'; el.textContent=el.dataset.full; });
  });
}
/* по КЛИКУ / стрелке / пробелу — следующий аватар (по одному) */
document.addEventListener('click', e=>{ if(e.target.id==='replay') return; nextAvatar(); });
document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); nextAvatar(); } });
document.getElementById('replay').addEventListener('click', resetAll);
</script>
</body>
</html>
