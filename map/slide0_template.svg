<?xml version="1.0" encoding="UTF-8"?>
<!--
  ШАБЛОН КАРТЫ слайда 0. Редактировать в Figma.
  Размер = пиксели картинки slide0.png (1672 x 941), поэтому линии лягут 1:1.

  Как работать в Figma:
  1. File > Place image > выбери img/slide0.png, растяни на весь фрейм 1672x941, ЗАБЛОКИРУЙ слой (замочек в слоях).
  2. Обводи неон-пути инструментом Pen (P). Главную дорогу клади в группу "paths" как "route-main",
     ответвления — как "branch". Цвет/толщина любые, я перекрашу.
  3. Точку старта (id="start") поставь в центр круга под предпринимателем.
  4. На каждое здание-объект поставь кружок в группе "objects" и НАЗОВИ слой понятно (напр. "Регистрация").
  5. Перед отправкой подложку-картинку можно скрыть/удалить. Сохрани/экспортируй SVG, пришли мне.
  Имена не критичны — координаты я считаю по линиям и точкам в любом случае.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">

  <!-- рамка фрейма (ориентир, можно удалить) -->
  <rect x="0" y="0" width="1672" height="941" fill="none" stroke="#333" stroke-width="2"/>

  <!-- СТАРТ ГЕРОЯ: центр круга-площадки (откуда бегут кометы) -->
  <circle id="start" cx="235" cy="775" r="12" fill="#ff00e6" stroke="#fff" stroke-width="2"/>

  <!-- ПУТИ: рисуй линии тут. Главная = route-main, ответвления = branch -->
  <g id="paths" fill="none" stroke="#ff2bd6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- пример главной магистрали (перерисуй по неону): -->
    <polyline id="route-main" points="235,775 360,690 470,640 560,610 720,600 900,560 1100,470 1300,360 1470,270"/>
    <!-- пример ответвления (копируй для каждого замочка): -->
    <polyline class="branch" points="560,610 540,470"/>
  </g>

  <!-- ОБЪЕКТЫ (замочки): точка на здание. Назови слой понятно. -->
  <g id="objects" fill="#ffd23b" stroke="#000" stroke-width="2">
    <!-- пример объекта (копируй для каждого): -->
    <circle class="object" cx="540" cy="470" r="10"/>
  </g>

</svg>
