name: Deploy presentation to Pages

# Публикуем ТОЛЬКО папку presentation/ под /presentation/ (URL сохранён).
# Два джоба: build заливает ОДИН артефакт, deploy публикует — иначе Re-run плодит
# несколько артефактов github-pages и deploy-pages падает («Multiple artifacts…»).

on:
  push:
    branches: [main]
    paths:
      - 'presentation/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Собрать сайт (только presentation/ под /presentation/)
        run: |
          mkdir -p _site/presentation
          cp -r presentation/. _site/presentation/
          touch _site/.nojekyll
          # В корне сайта своего index.html нет → короткий адрес отдавал 404.
          # Кладём редирект: /<репо>/ → /<репо>/presentation/index.html
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Московский предпринимательский квест</title>
          <meta http-equiv="refresh" content="0; url=./presentation/index.html">
          <link rel="canonical" href="./presentation/index.html">
          <p>Переход к презентации… <a href="./presentation/index.html">Открыть</a></p>
          HTML
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
